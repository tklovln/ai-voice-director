const ICON = {"play16": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5 11 7-11 7Z\" fill=\"currentColor\"/></svg>", "play21": "<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5 11 7-11 7Z\" fill=\"currentColor\"/></svg>", "play22": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 5 11 7-11 7Z\" fill=\"currentColor\"/></svg>", "pause16": "<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5h3v14H8zM15 5h3v14h-3z\" fill=\"currentColor\"/></svg>", "pause21": "<svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5h3v14H8zM15 5h3v14h-3z\" fill=\"currentColor\"/></svg>", "pause22": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5h3v14H8zM15 5h3v14h-3z\" fill=\"currentColor\"/></svg>"};
const CHECK = "<svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m5 12 4 4L19 6\"/></svg>";
const $ = id => document.getElementById(id);
// A real <audio> element rather than `new Audio()`: it is what the page's own
// controls drive, and it keeps the player inspectable from the page itself.
const audio = $("player");
let current = 0, track = "reference", volume = 0.85;
audio.volume = volume;
const character = () => DATA[current];
const emotion = () => character().emotions.find(e => e.emotion_id === track);
const clip = () => track === "reference" ? character().reference : emotion().audio;
const fmt = s => { const v = Math.max(0, Math.floor(s || 0)); return `${Math.floor(v/60)}:${String(v%60).padStart(2,"0")}`; };

function bars(peaks, step) {
  return peaks.filter((_, i) => i % step === 0)
    .map(p => `<i style="height:${Math.max(8, p * 100)}%"></i>`).join("");
}

function renderRoster() {
  $("roster").innerHTML = DATA.map((c, i) => `
    <button class="card" data-index="${i}" aria-label="選擇${c.name}" aria-pressed="${i === current}">
      <span class="check">${CHECK}</span>
      <span class="thumb" style="background:color-mix(in srgb, ${c.color} 7%, #f7f7f0)">
        <img src="${c.portraits.normal || ""}" alt="">
      </span>
      <span class="cardname">${c.name}</span>
    </button>`).join("");
  for (const button of $("roster").children) {
    button.onclick = () => select(+button.dataset.index);
    button.onkeydown = event => {
      const keys = { ArrowLeft: current - 1, ArrowRight: current + 1, Home: 0, End: DATA.length - 1 };
      if (!(event.key in keys)) return;
      event.preventDefault();
      const next = (keys[event.key] + DATA.length) % DATA.length;
      select(next);
      $("roster").children[next].focus();
    };
  }
}

function renderEmotions() {
  $("emotions").innerHTML = character().emotions.map(e => `
    <button class="emotion" data-id="${e.emotion_id}" style="--emotion:${e.color}"
            aria-label="試聽${character().name}的${e.label}" aria-pressed="${track === e.emotion_id}">
      <span class="glyph">${e.label}</span>
      <span class="wave small ${track === e.emotion_id && !audio.paused ? "active" : ""}">${bars(e.audio.waveform, 4)}</span>
      <span class="ebottom"><span>${e.audio.duration_s.toFixed(1)}s</span>${track === e.emotion_id && !audio.paused ? ICON.pause16 : ICON.play16}</span>
    </button>`).join("");
  for (const button of $("emotions").children) button.onclick = () => play(button.dataset.id);
}

function render() {
  const c = character();
  document.body.style.setProperty("--accent", c.color);
  const expression = track === "reference" ? "normal" : emotion().expression;
  $("hero").className = "hero" + (audio.paused ? "" : " speaking");
  $("portrait").src = c.portraits[expression] || c.portraits.normal || "";
  $("portrait").alt = `${c.name}角色立繪`;
  $("name").textContent = c.name;
  $("rarity").textContent = c.rarity;
  $("quote").textContent = track === "reference" ? c.catchphrases : emotion().text;
  $("refdur").textContent = c.reference.duration_s.toFixed(1) + "s";
  $("refwave").innerHTML = bars(c.reference.waveform, 1);
  $("refwave").className = "wave" + (track === "reference" && !audio.paused ? " active" : "");
  $("reference").setAttribute("aria-pressed", track === "reference");
  $("reference").setAttribute("aria-label", `試聽${c.name}的基準聲線`);
  $("reficon").innerHTML = track === "reference" && !audio.paused ? ICON.pause22 : ICON.play22;
  $("nowplaying").textContent = track === "reference" ? "基準音" : emotion().label;
  $("state").textContent = audio.paused ? (audio.src ? "已暫停" : "準備試聽") : "正在播放";
  $("mainplay").innerHTML = audio.paused ? ICON.play21 : ICON.pause21;
  $("mainplay").setAttribute("aria-label", audio.paused ? "播放目前語音" : "暫停播放");
  $("volicon").innerHTML = volume ? "<svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 4-6 5H2v6h3l6 5Z\"/><path d=\"M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14\"/></svg>" : "<svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 4-6 5H2v6h3l6 5Z\"/><path d=\"m16 9 6 6m0-6-6 6\"/></svg>";
  $("volicon").setAttribute("aria-label", volume ? "靜音" : "開啟聲音");
  const label = track === "reference" ? "基準音" : emotion().label;
  $("download").href = clip().url;
  $("download").download = `${c.name}_${label}.wav`;
  $("download").setAttribute("aria-label", `下載${c.name}的${label}`);
  renderEmotions();
  for (const button of $("roster").children) {
    button.setAttribute("aria-pressed", +button.dataset.index === current);
  }
  progress();
}

function progress() {
  const total = audio.duration || clip().duration_s || 0;
  const at = audio.currentTime || 0;
  $("at").textContent = fmt(at);
  $("total").textContent = fmt(total);
  $("seek").max = total || 1;
  $("seek").value = Math.min(at, total || 1);
  $("seek").disabled = !audio.duration;
  $("seek").style.setProperty("--progress", `${total ? (at / total) * 100 : 0}%`);
}

function select(index) {
  if (index === current) return;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  current = index;
  track = "reference";
  render();
}

function play(next) {
  const changed = next !== track;
  track = next;
  const source = new URL(clip().url, location.href).href;
  if (!changed && audio.src === source && !audio.paused) { audio.pause(); return; }
  if (audio.src !== source) { audio.src = source; }
  if (audio.ended) audio.currentTime = 0;
  audio.play().catch(() => render());
  render();
}

$("reference").onclick = () => play("reference");
$("mainplay").onclick = () => play(track);
$("volicon").onclick = () => { volume = volume ? 0 : 0.85; audio.volume = volume; $("vol").value = volume; render(); };
$("vol").oninput = event => { volume = +event.target.value; audio.volume = volume; render(); };
$("seek").oninput = event => { if (audio.duration) { audio.currentTime = +event.target.value; progress(); } };
audio.addEventListener("play", render);
audio.addEventListener("pause", render);
audio.addEventListener("ended", render);
audio.addEventListener("timeupdate", progress);
audio.addEventListener("loadedmetadata", progress);

renderRoster();
render();
</script>
